<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/gif/png" href="UUU/Captura de pantalla 2024-07-17 234943.png">
    <title>Uso de span</title>
    <style>
        .tipos_fruta{
            color:blueviolet;
            font-size: 150%;
            text-decoration: underline;

        }
        .ejemplofruta{
            color:blue;
            font-size: 150%;
        
        }
    </style>
</head>
<body>
    <h2>Usando span para dar formato texto con CSS</h2>
    <p>
        <span class="tipos_fruta">Frutas con hueso:</span>
        <span class="ejemplo_fruta">Ciruela</span>
        <span class="ejemplo_fruta">Aguacate</span>
        <span class="ejemplo_fruta">Durazno</span>
        <span class="ejemplo_fruta">Rambutan</span>
    </p>
    <p>
        <span class="tipos_fruta">Frutas con hueso:</span>
        <span class="ejemplo_fruta">Guayaba</span>
        <span class="ejemplo_fruta">Sandia</span>
        <span class="ejemplo_fruta">Kiwi</span>
        <span class="ejemplo_fruta">Uva</span>
    </p>
    
</body>
</html>
