<!DOCTYPE html>
<html lang="en">
<head>

    <title>Relative DIV</title>
    <link rel="icon" type="image/gif/png" href="UUU/Captura de pantalla 2024-07-17 234943.png">
    <style>
        div.relativo{
            position: relative;
            left: 30px;
            border: 5px solid red;
        }
    </style>
</head>
<body>
    <h2>Posicion del DIV: relative;</h2>

    <p>Un elemento con posicion Relativa se puede ubicar de manera Relativa
    a su posicion original, y se puede modificar su ubicacion desde CSS</p>
    
    <div class="relativo">
        <p>Este elemento DIV tiene asignada la posicion: <b><i>relative;</i></b></p>
    </div>
</body>
</html>
