<!DOCTYPE html>
<html>

<head>
    <title>Reubicación</title>
    <link rel="icon" type="image/gif/png" href="UUU/Captura de pantalla 2024-07-17 234943.png">
    <style>
        div {
            width: 300px;
            height: 100px;
            background-color: cyan;
            border: 3px solid black;
            transform: translate(50px,100px);
        }
    </style>
</head>

<body>

    <h2>Reubicando un DIV</h2>
    <p>Se puede transformar la posición de un DIV con el método de trasladar:</p>

    <div>
        El método translate() altera la posición original de un elemento.
        El elemento DIV que se muestra aquí, está movido 50 pixeles a la derecha
        y 100 pixeles hacia abajo, a partir de su posición original.
    </div>

</body>

</html>
