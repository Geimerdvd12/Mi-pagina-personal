<!DOCTYPE html>
<html lang="en">
<head>

    <title>Static Div</title>

    <style>
        div.estatico{
            position: static;
        border: 3px solid green;   
    }
    </style>
</head>
<body>
    <h2>Posicion del DIV: static</h2>
    <p>Un elemento con posicion estatica no se ubica de ninguna forma
     especial, se ubica siempre segun el flujo normal de la pagina.</p>
    
    <div class="estatico">
        <p>Este elemento DIV tiene asignada la posiscion:<b><i> static;</i></b></p>
    </div>
    
</body>
</html>
